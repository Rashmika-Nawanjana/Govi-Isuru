version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-govi_secret}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/govi_isuru}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN}
      - WHATSAPP_BOT_URL=http://whatsapp-bot:7000
      - WHATSAPP_BOT_KEY=${WHATSAPP_BOT_KEY:-}
    depends_on:
      - mongo
      - ai-service
  
  whatsapp-bot:
    build: ./whatsapp-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - BOT_PORT=7000
      - BACKEND_URL=http://backend:5000
      - WHATSAPP_BOT_KEY=${WHATSAPP_BOT_KEY:-}
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:-}
      - BOT_PHONE_NUMBER=${BOT_PHONE_NUMBER:-}
    volumes:
      - whatsapp_auth:/app/auth_state
    depends_on:
      - backend

  frontend:
    build:
      context: ./client
      args:
        REACT_APP_API_URL: "https://govi-isuru.kalanalakshan.me"
        REACT_APP_AI_URL: "https://govi-isuru.kalanalakshan.me"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  mongo_data:
  whatsapp_auth: