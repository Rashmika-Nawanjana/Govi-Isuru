server {
  listen       80;
  server_name  govi-isuru.rashmika.dev www.govi-isuru.rashmika.dev;

  return 301 https://$host$request_uri;
}

server {
  listen       443 ssl http2;
  server_name  govi-isuru.rashmika.dev www.govi-isuru.rashmika.dev;

  ssl_certificate     /etc/letsencrypt/live/govi-isuru.rashmika.dev/fullchain.pem;
  ssl_certificate_key  /etc/letsencrypt/live/govi-isuru.rashmika.dev/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Allow large image uploads (5 images × 5MB each + form data)
  client_max_body_size 30m;

  # Serve static files
  root   /usr/share/nginx/html;
  index  index.html index.htm;

  # Proxy uploaded images to backend
  location /uploads/ {
    proxy_pass         http://backend:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Backend health check (used by deploy verification)
  location = /health {
    proxy_pass         http://backend:5000/health;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Proxy API requests to backend service
  location /api/ {
    proxy_pass         http://backend:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection keep-alive;
    proxy_set_header   Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Proxy AI service requests
  location /ai/ {
    proxy_pass         http://ai-service:8000/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
  }

  # SPA fallback for client-side routing
  location / {
    try_files $uri /index.html;
  }
}
