name: Deploy to EC2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync application files
        run: |
          set -e
          APP_DIR="/home/ubuntu/govi-isuru"
          mkdir -p "$APP_DIR"
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude 'ai-service/venv' \
            --exclude 'ai-service/venv311' \
            --exclude '.venv' \
            --exclude 'goviisuru.pem' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

      - name: Deploy with Docker Compose
        run: |
          set -e
          cd /home/ubuntu/govi-isuru
          DOMAIN="govi-isuru.rashmika.dev"

          sudo systemctl stop nginx || true
          sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true

          if grep -q '^APP_URL=' .env; then
            sudo sed -i "s|^APP_URL=.*|APP_URL=https://${DOMAIN}|" .env
          else
            echo "APP_URL=https://${DOMAIN}" | sudo tee -a .env >/dev/null
          fi

          if grep -q '^FRONTEND_URL=' .env; then
            sudo sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=https://${DOMAIN}|" .env
          else
            echo "FRONTEND_URL=https://${DOMAIN}" | sudo tee -a .env >/dev/null
          fi

          if ! grep -q '^REFRESH_TOKEN_SECRET=' .env; then
            REFRESH_SECRET="$(openssl rand -hex 32)"
            echo "REFRESH_TOKEN_SECRET=${REFRESH_SECRET}" | sudo tee -a .env >/dev/null
            echo "Added REFRESH_TOKEN_SECRET to .env"
          fi

          if ! grep -qE '^GOOGLE_SERVICE_ACCOUNT_JSON=|^GOOGLE_SERVICE_ACCOUNT_JSON_B64=' .env; then
            echo "WARNING: GOOGLE_SERVICE_ACCOUNT_JSON is missing from /home/ubuntu/govi-isuru/.env"
            echo "Voice chatbot will stay disabled until that env var is added on the server."
          else
            echo "Google service account env detected in .env"
          fi

          if ! grep -q '^WHATSAPP_BOT_KEY=' .env; then
            BOT_KEY="$(openssl rand -hex 32)"
            echo "WHATSAPP_BOT_KEY=${BOT_KEY}" | sudo tee -a .env >/dev/null
            echo "Generated WHATSAPP_BOT_KEY"
          fi

          if ! grep -q '^BOT_ADMIN_KEY=' .env; then
            ADMIN_KEY="$(openssl rand -hex 24)"
            echo "BOT_ADMIN_KEY=${ADMIN_KEY}" | sudo tee -a .env >/dev/null
            echo "Generated BOT_ADMIN_KEY. Read it on the box with:"
            echo "  grep '^BOT_ADMIN_KEY=' /home/ubuntu/govi-isuru/.env"
            echo "(The pairing QR is also printed by: docker logs govi-whatsapp-bot)"
          fi

          if ! grep -q '^BOT_PHONE_NUMBER=' .env; then
            echo "WARNING: BOT_PHONE_NUMBER is missing from /home/ubuntu/govi-isuru/.env"
            echo "The poster wa.me link cannot be built until that env var is added."
          else
            echo "WhatsApp bot number detected in .env"
          fi

          if ! grep -q '^DAILY_API_KEY=' .env; then
            echo "WARNING: DAILY_API_KEY is missing from /home/ubuntu/govi-isuru/.env"
            echo "Video consultations will stay disabled until that env var is added on the server."
          else
            echo "Daily.co API key detected in .env"
          fi

          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y certbot
          fi

          if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
            sudo certbot certonly --standalone \
              -d "${DOMAIN}" \
              --register-unsafely-without-email \
              --agree-tos \
              --non-interactive
          else
            sudo certbot renew --non-interactive || true
          fi

          sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          sudo docker image prune -f

      - name: Seed WhatsApp guest demo account
        run: |
          cd /home/ubuntu/govi-isuru
          # Guests who message the bot without a Govi Isuru login run against
          # this account. Without it they hit a login wall. The script is
          # idempotent; a failure here must not fail the site deploy.
          for i in $(seq 1 6); do
            if sudo docker compose -f docker-compose.prod.yml exec -T backend \
                 node scripts/seed-whatsapp-demo.js; then
              echo "Demo account ready."
              break
            fi
            echo "Backend not ready for seeding yet (attempt ${i})."
            sleep 10
          done || true

      - name: Health check
        run: |
          set -e
          echo "Waiting for HTTPS health checks..."
          FRONTEND_STATUS="000"
          BACKEND_STATUS="000"
          for i in $(seq 1 12); do
            FRONTEND_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://govi-isuru.rashmika.dev/ || echo "000")
            BACKEND_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://govi-isuru.rashmika.dev/health || echo "000")
            echo "Attempt ${i}: frontend=${FRONTEND_STATUS} backend=${BACKEND_STATUS}"
            if [ "$FRONTEND_STATUS" = "200" ] && [ "$BACKEND_STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done

          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "Frontend health check failed"
            exit 1
          fi

          if [ "$BACKEND_STATUS" != "200" ]; then
            echo "Backend health check failed"
            exit 1
          fi

          curl -k -s https://govi-isuru.rashmika.dev/health
          echo ""
          echo "Voice status:"
          curl -k -s https://govi-isuru.rashmika.dev/api/llama-chatbot/voice/status || true
          echo ""
          echo "WhatsApp bot status:"
          BOT_STATUS=$(curl -k -s https://govi-isuru.rashmika.dev/bot/status || echo '{}')
          echo "$BOT_STATUS"
          if echo "$BOT_STATUS" | grep -q '"connected":true'; then
            echo "WhatsApp bot is paired and connected."
          else
            echo "NOTE: WhatsApp bot is not connected. Scan the pairing QR at /bot/qr?key=<BOT_ADMIN_KEY>."
            echo "This does not fail the deploy - the website is unaffected."
          fi
          echo ""
          sudo docker compose -f /home/ubuntu/govi-isuru/docker-compose.prod.yml ps
