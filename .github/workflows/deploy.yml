name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy if CI passes
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy project files to EC2
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/govi-isuru/

      - name: Deploy with Docker Compose (safe)
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            set -e
            cd /home/${{ secrets.EC2_USERNAME }}/govi-isuru
            DOMAIN="govi-isuru.rashmika.dev"

            # stop host nginx to avoid port conflicts (non-fatal)
            sudo systemctl stop nginx || true

            # Ensure a clean recreate to avoid port-flapping and orphaned containers
            sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true

            # Keep the backend URLs aligned with the public HTTPS domain
            sudo sed -i "s|^APP_URL=.*|APP_URL=https://${DOMAIN}|" .env || true
            sudo sed -i "s|^FRONTEND_URL=.*|FRONTEND_URL=https://${DOMAIN}|" .env || true

            # Install or renew the TLS certificate before the frontend starts
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y certbot
            fi

            if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
              sudo certbot certonly --standalone \
                -d "${DOMAIN}" \
                --register-unsafely-without-email \
                --agree-tos \
                --non-interactive
            else
              sudo certbot renew --non-interactive || true
            fi

            sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Cleanup old images
            sudo docker image prune -f

            # Give containers a moment to initialize
            sleep 10

            # Show status
            echo "=== Container Status ==="
            sudo docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "✅ Deployment complete!"
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting 60s for services to start..."
          sleep 60
          HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://${{ secrets.EC2_HOST }} || echo "000")
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✅ Health check passed (HTTPS $HTTP_STATUS)"
          else
            echo "⚠️ Health check returned HTTPS $HTTP_STATUS - services may still be starting or port 443 is not open"
            echo "Check server state: ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} 'sudo docker compose -f /home/${{ secrets.EC2_USERNAME }}/govi-isuru/docker-compose.prod.yml ps && sudo ss -lntu'"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key
